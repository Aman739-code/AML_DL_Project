<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="svmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="rfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="lrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="rbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="champGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .svm-bar {
      animation: growSvm 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .rf-bar {
      animation: growRf 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .lr-bar {
      animation: growLr 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .rb-bar {
      animation: growRb 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .champ-pulse {
      animation: champPulse 2s ease-in-out infinite alternate;
    }
    @keyframes growSvm {
      from { width: 0px; }
      to { width: 354px; }
    }
    @keyframes growRf {
      from { width: 0px; }
      to { width: 350px; }
    }
    @keyframes growLr {
      from { width: 0px; }
      to { width: 350px; }
    }
    @keyframes growRb {
      from { width: 0px; }
      to { width: 283px; }
    }
    @keyframes champPulse {
      0% { opacity: 0.8; filter: drop-shadow(0 0 2px #10b981); }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #34d399); }
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="916" height="256" rx="14" fill="url(#chartBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.4">
      RELATION CLASSIFICATION BENCHMARK (TEST SET EVALUATION)
    </text>
    <text x="0" y="18" font-size="11" fill="#94a3b8">
      Macro F1 is the definitive unbiased metric under severe class imbalance (~87% label 0).
    </text>
  </g>

  <!-- Bars Area -->
  <g transform="translate(30, 75)">
    <!-- Axis lines -->
    <line x1="160" y1="0" x2="160" y2="155" stroke="#334155" stroke-width="1.2" />
    <line x1="160" y1="155" x2="780" y2="155" stroke="#334155" stroke-width="1.2" />

    <!-- Grid ticks: 0.0, 0.2, 0.4, 0.6 -->
    <text x="160" y="170" font-size="9" fill="#64748b" text-anchor="middle">0.0</text>
    <text x="280" y="170" font-size="9" fill="#64748b" text-anchor="middle">0.2</text>
    <line x1="280" y1="0" x2="280" y2="155" stroke="#1e293b" stroke-dasharray="2 4" />
    <text x="400" y="170" font-size="9" fill="#64748b" text-anchor="middle">0.4</text>
    <line x1="400" y1="0" x2="400" y2="155" stroke="#1e293b" stroke-dasharray="2 4" />
    <text x="520" y="170" font-size="9" fill="#64748b" text-anchor="middle">0.6</text>
    <line x1="520" y1="0" x2="520" y2="155" stroke="#1e293b" stroke-dasharray="2 4" />
    <text x="640" y="170" font-size="9" fill="#64748b" text-anchor="middle">0.8</text>
    <line x1="640" y1="0" x2="640" y2="155" stroke="#1e293b" stroke-dasharray="2 4" />
    <text x="760" y="170" font-size="9" fill="#64748b" text-anchor="middle">1.0 (Macro F1)</text>

    <!-- Model 1: LinearSVM (Champion) -->
    <g transform="translate(0, 10)">
      <text x="145" y="18" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">Linear SVM ★</text>
      <rect x="160" y="4" width="600" height="20" rx="4" fill="#0f172a" />
      <rect class="svm-bar" x="160" y="4" width="354" height="20" rx="4" fill="url(#svmGrad)" />
      <text x="525" y="18" font-size="11" font-weight="800" fill="#34d399">0.5907</text>
      <text x="580" y="18" font-size="9.5" fill="#a7f3d0">(Macro R: 0.6818 | Prec: 0.6014)</text>
    </g>

    <!-- Model 2: Logistic Regression -->
    <g transform="translate(0, 45)">
      <text x="145" y="18" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">Logistic Reg.</text>
      <rect x="160" y="4" width="600" height="20" rx="4" fill="#0f172a" />
      <rect class="lr-bar" x="160" y="4" width="350" height="20" rx="4" fill="url(#lrGrad)" />
      <text x="520" y="18" font-size="11" font-weight="700" fill="#38bdf8">0.5839</text>
      <text x="575" y="18" font-size="9.5" fill="#94a3b8">(Macro R: 0.6654 | Prec: 0.5934)</text>
    </g>

    <!-- Model 3: Random Forest -->
    <g transform="translate(0, 80)">
      <text x="145" y="18" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">Random Forest</text>
      <rect x="160" y="4" width="600" height="20" rx="4" fill="#0f172a" />
      <rect class="rf-bar" x="160" y="4" width="350" height="20" rx="4" fill="url(#rfGrad)" />
      <text x="520" y="18" font-size="11" font-weight="700" fill="#818cf8">0.5832</text>
      <text x="575" y="18" font-size="9.5" fill="#94a3b8">(Macro R: 0.6601 | Prec: 0.5913)</text>
    </g>

    <!-- Model 4: Rule-Based -->
    <g transform="translate(0, 115)">
      <text x="145" y="18" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">Rule-Based</text>
      <rect x="160" y="4" width="600" height="20" rx="4" fill="#0f172a" />
      <rect class="rb-bar" x="160" y="4" width="283" height="20" rx="4" fill="url(#rbGrad)" />
      <text x="453" y="18" font-size="11" font-weight="700" fill="#94a3b8">0.4725</text>
      <text x="510" y="18" font-size="9.5" fill="#64748b">(Accuracy 0.8184 is inflated by label 0!)</text>
    </g>
  </g>
</svg>
