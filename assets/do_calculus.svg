<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="barObservational" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="barIntervention" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <marker id="dcArrow" viewBox="0 0 10 10" refX="15" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <style>
    .severed-edge {
      animation: cutWire 3s ease-in-out infinite alternate;
    }
    .cut-cross {
      animation: flashRed 3s ease-in-out infinite alternate;
    }
    .prob-bar-obs {
      animation: barGrowObs 3s ease-in-out infinite alternate;
    }
    .prob-bar-do {
      animation: barGrowDo 3s ease-in-out infinite alternate;
    }
    @keyframes cutWire {
      0% { opacity: 0.8; stroke-dashoffset: 0; }
      100% { opacity: 0.15; stroke-dashoffset: 12; }
    }
    @keyframes flashRed {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes barGrowObs {
      0% { width: 140px; }
      100% { width: 164px; }
    }
    @keyframes barGrowDo {
      0% { width: 120px; }
      100% { width: 143px; }
    }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="916" height="276" rx="14" fill="url(#dcBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.4">
      PEARLIAN CAUSAL INFERENCE: OBSERVATION VS INTERVENTION (DO-CALCULUS)
    </text>
    <text x="0" y="18" font-size="11" fill="#94a3b8">
      Proving why Language Models alone cannot answer causal questions without Pearl's graph surgery.
    </text>
  </g>

  <!-- Left: Observational Conditioning P(B | E = high) -->
  <g transform="translate(30, 70)">
    <rect width="415" height="185" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="210" height="20" rx="4" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8" />
    <text x="120" y="26" font-size="9" font-weight="700" fill="#fcd34d" text-anchor="middle">OBSERVATIONAL: P(B | E = high)</text>

    <!-- Mini Graph (Ancestral Backdoor Path Open) -->
    <g transform="translate(30, 50)">
      <!-- Node C (Ancestor / Confounder) -->
      <circle cx="60" cy="20" r="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="60" y="24" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">A</text>

      <!-- Node E (Evidence) -->
      <circle cx="20" cy="80" r="12" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
      <text x="20" y="84" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">E</text>

      <!-- Node B (Target) -->
      <circle cx="100" cy="80" r="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="100" y="84" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">B</text>

      <!-- Confounding Paths Active -->
      <line x1="52" y1="28" x2="26" y2="70" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#dcArrow)" />
      <line x1="68" y1="28" x2="94" y2="70" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#dcArrow)" />
      <line x1="33" y1="80" x2="86" y2="80" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
      
      <text x="60" y="105" font-size="8" fill="#fbbf24" font-weight="600" text-anchor="middle">Back-door Open</text>
    </g>

    <!-- Output & Interpretation -->
    <g transform="translate(190, 50)">
      <text x="0" y="16" font-size="11" font-weight="700" fill="#f1f5f9">Posterior Distribution:</text>
      
      <!-- High Bar -->
      <text x="0" y="38" font-size="9.5" fill="#94a3b8">B(high):</text>
      <rect x="45" y="28" width="150" height="13" rx="3" fill="#1e293b" />
      <rect class="prob-bar-obs" x="45" y="28" width="124" height="13" rx="3" fill="url(#barObservational)" />
      <text x="175" y="39" font-size="10" font-weight="700" fill="#fbbf24">82.40%</text>

      <!-- Low Bar -->
      <text x="0" y="58" font-size="9.5" fill="#94a3b8">B(low):</text>
      <rect x="45" y="48" width="150" height="13" rx="3" fill="#1e293b" />
      <rect x="45" y="48" width="26" height="13" rx="3" fill="#94a3b8" opacity="0.6" />
      <text x="78" y="59" font-size="10" font-weight="700" fill="#94a3b8">17.60%</text>

      <rect x="0" y="74" width="205" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="8" y="90" font-size="8" fill="#fcd34d">⚠️ Conflates direct causal effect</text>
      <text x="8" y="104" font-size="8" fill="#fcd34d">with shared ancestral confounding (A).</text>
    </g>
  </g>

  <!-- Right: Interventional Query P(B | do(E = high)) -->
  <g transform="translate(475, 70)">
    <rect width="415" height="185" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="230" height="20" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="0.8" />
    <text x="130" y="26" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle">PEARL SURGERY: P(B | do(E = high))</text>

    <!-- Mini Graph (Incoming Edges into E Severed!) -->
    <g transform="translate(30, 50)">
      <!-- Node C (Ancestor) -->
      <circle cx="60" cy="20" r="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <text x="60" y="24" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">A</text>

      <!-- Node E (Intervened) -->
      <circle cx="20" cy="80" r="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="20" y="84" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">do(E)</text>

      <!-- Node B (Target) -->
      <circle cx="100" cy="80" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="100" y="84" font-size="10" font-weight="700" fill="#7dd3fc" text-anchor="middle">B</text>

      <!-- Severed Inflow Edge -->
      <line class="severed-edge" x1="52" y1="28" x2="26" y2="70" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" />
      <!-- Red Cross on severed path -->
      <g transform="translate(38, 48)" class="cut-cross">
        <circle cx="0" cy="0" r="6" fill="#881337" stroke="#f43f5e" stroke-width="1" />
        <line x1="-3" y1="-3" x2="3" y2="3" stroke="#fff" stroke-width="1.2" />
        <line x1="3" y1="-3" x2="-3" y2="3" stroke="#fff" stroke-width="1.2" />
      </g>

      <line x1="68" y1="28" x2="94" y2="70" stroke="#64748b" stroke-width="1.2" marker-end="url(#dcArrow)" />
      <line x1="33" y1="80" x2="86" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#dcArrow)" />
      
      <text x="60" y="105" font-size="8" fill="#38bdf8" font-weight="600" text-anchor="middle">Pure Causal Path</text>
    </g>

    <!-- Output & Interpretation -->
    <g transform="translate(190, 50)">
      <text x="0" y="16" font-size="11" font-weight="700" fill="#f1f5f9">True Interventional Effect:</text>
      
      <!-- High Bar -->
      <text x="0" y="38" font-size="9.5" fill="#94a3b8">B(high):</text>
      <rect x="45" y="28" width="150" height="13" rx="3" fill="#1e293b" />
      <rect class="prob-bar-do" x="45" y="28" width="108" height="13" rx="3" fill="url(#barIntervention)" />
      <text x="160" y="39" font-size="10" font-weight="700" fill="#38bdf8">71.93%</text>

      <!-- Low Bar -->
      <text x="0" y="58" font-size="9.5" fill="#94a3b8">B(low):</text>
      <rect x="45" y="48" width="150" height="13" rx="3" fill="#1e293b" />
      <rect x="45" y="48" width="42" height="13" rx="3" fill="#94a3b8" opacity="0.6" />
      <text x="94" y="59" font-size="10" font-weight="700" fill="#94a3b8">28.07%</text>

      <rect x="0" y="74" width="205" height="42" rx="4" fill="#082f49" stroke="#0369a1" stroke-width="0.8" />
      <text x="8" y="90" font-size="8" fill="#7dd3fc">✅ Confounding Bias: Δ = -10.47%</text>
      <text x="8" y="104" font-size="8" fill="#e0f2fe">pgmpy isolates the pure physical intervention.</text>
    </g>
  </g>
</svg>
