<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="pipeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .flow-wire {
      stroke-dasharray: 8 6;
      animation: flowForward 12s linear infinite;
    }
    .flow-wire-slow {
      stroke-dasharray: 6 6;
      animation: flowForward 18s linear infinite;
    }
    .pulse-dot {
      animation: pulseDot 2s ease-in-out infinite alternate;
    }
    .moving-packet-1 {
      animation: movePacket1 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .moving-packet-2 {
      animation: movePacket2 6s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s;
    }
    .moving-packet-3 {
      animation: movePacket3 6s cubic-bezier(0.4, 0, 0.2, 1) infinite 4s;
    }
    @keyframes flowForward {
      to { stroke-dashoffset: -200; }
    }
    @keyframes pulseDot {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes movePacket1 {
      0% { cx: 135px; cy: 110px; opacity: 0; }
      5% { opacity: 1; }
      20% { cx: 285px; cy: 110px; }
      40% { cx: 435px; cy: 110px; }
      60% { cx: 585px; cy: 110px; }
      80% { cx: 735px; cy: 110px; }
      95% { cx: 855px; cy: 110px; opacity: 1; }
      100% { cx: 870px; cy: 110px; opacity: 0; }
    }
    @keyframes movePacket2 {
      0% { cx: 135px; cy: 110px; opacity: 0; }
      5% { opacity: 1; }
      20% { cx: 285px; cy: 110px; }
      40% { cx: 435px; cy: 110px; }
      60% { cx: 585px; cy: 110px; }
      80% { cx: 735px; cy: 110px; }
      95% { cx: 855px; cy: 110px; opacity: 1; }
      100% { cx: 870px; cy: 110px; opacity: 0; }
    }
    @keyframes movePacket3 {
      0% { cx: 135px; cy: 110px; opacity: 0; }
      5% { opacity: 1; }
      20% { cx: 285px; cy: 110px; }
      40% { cx: 435px; cy: 110px; }
      60% { cx: 585px; cy: 110px; }
      80% { cx: 735px; cy: 110px; }
      95% { cx: 855px; cy: 110px; opacity: 1; }
      100% { cx: 870px; cy: 110px; opacity: 0; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="936" height="316" rx="14" fill="url(#pipeBgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Stage Title & Flow Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.4">
      END-TO-END NEURO-SYMBOLIC PIPELINE ARCHITECTURE
    </text>
    <text x="520" y="0" font-size="11" font-weight="500" fill="#38bdf8">
      ● Live Data &amp; Causal Signal Progression
    </text>
  </g>

  <!-- Main Pipeline Bus Wire -->
  <path d="M 80 110 L 860 110" stroke="url(#wireGrad)" stroke-width="2.5" class="flow-wire" opacity="0.7" />

  <!-- Animated Glowing Data Packets -->
  <circle class="moving-packet-1" r="5" fill="#38bdf8" filter="url(#nodeGlow)" />
  <circle class="moving-packet-2" r="5" fill="#a855f7" filter="url(#nodeGlow)" />
  <circle class="moving-packet-3" r="5" fill="#34d399" filter="url(#nodeGlow)" />

  <!-- Stage 1: Data Acquisition -->
  <g transform="translate(25, 60)">
    <rect width="125" height="100" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="22" r="9" fill="#0284c7" />
    <text x="20" y="26" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
    <text x="36" y="25" font-size="11" font-weight="700" fill="#f1f5f9">Acquisition</text>
    
    <text x="12" y="48" font-size="9" fill="#94a3b8">• Corr2Cause CSV</text>
    <text x="12" y="62" font-size="9" fill="#94a3b8">• SHA-256 Hashes</text>
    <text x="12" y="76" font-size="9" fill="#38bdf8" font-weight="600">• Zero Text Leak</text>
    <rect x="10" y="84" width="105" height="10" rx="2" fill="#0369a1" fill-opacity="0.2" />
    <text x="62" y="92" font-size="7.5" fill="#7dd3fc" font-weight="600" text-anchor="middle">411,469 Records</text>
  </g>

  <!-- Stage 2: Feature Engineering -->
  <g transform="translate(175, 60)">
    <rect width="125" height="100" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="20" cy="22" r="9" fill="#4338ca" />
    <text x="20" y="26" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
    <text x="36" y="25" font-size="11" font-weight="700" fill="#f1f5f9">Features</text>

    <text x="12" y="48" font-size="9" fill="#94a3b8">• Causal Cue Words</text>
    <text x="12" y="62" font-size="9" fill="#94a3b8">• Cond. Independence</text>
    <text x="12" y="76" font-size="9" fill="#818cf8" font-weight="600">• Train-only Encoders</text>
    <rect x="10" y="84" width="105" height="10" rx="2" fill="#312e81" fill-opacity="0.3" />
    <text x="62" y="92" font-size="7.5" fill="#a5b4fc" font-weight="600" text-anchor="middle">28 Causal Signals</text>
  </g>

  <!-- Stage 3: Baseline Classifiers -->
  <g transform="translate(325, 60)">
    <rect width="130" height="100" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="20" cy="22" r="9" fill="#7e22ce" />
    <text x="20" y="26" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">05</text>
    <text x="36" y="25" font-size="11" font-weight="700" fill="#f1f5f9">Classifiers</text>

    <text x="12" y="48" font-size="9" fill="#94a3b8">• Rule-Based (Regex)</text>
    <text x="12" y="62" font-size="9" fill="#94a3b8">• LogReg &amp; RandForest</text>
    <text x="12" y="76" font-size="9" fill="#c084fc" font-weight="600">• LinearSVM Best</text>
    <rect x="10" y="84" width="110" height="10" rx="2" fill="#581c87" fill-opacity="0.3" />
    <text x="65" y="92" font-size="7.5" fill="#d8b4fe" font-weight="600" text-anchor="middle">Macro F1: 0.5907</text>
  </g>

  <!-- Stage 4: DAG & Cycle Resolution -->
  <g transform="translate(480, 60)">
    <rect width="135" height="100" rx="8" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="20" cy="22" r="9" fill="#be123c" />
    <text x="20" y="26" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">06</text>
    <text x="36" y="25" font-size="11" font-weight="700" fill="#f1f5f9">DAG Surgery</text>

    <text x="12" y="48" font-size="9" fill="#94a3b8">• Self-loop Rejection</text>
    <text x="12" y="62" font-size="9" fill="#94a3b8">• 15 Cycles Detected</text>
    <text x="12" y="76" font-size="9" fill="#fb7185" font-weight="600">• Conf-Guided Prune</text>
    <rect x="10" y="84" width="115" height="10" rx="2" fill="#881337" fill-opacity="0.3" />
    <text x="67" y="92" font-size="7.5" fill="#fda4af" font-weight="600" text-anchor="middle">30 → 15 Edges (DAG)</text>
  </g>

  <!-- Stage 5: Bayesian Network Fit -->
  <g transform="translate(640, 60)">
    <rect width="130" height="100" rx="8" fill="url(#cardGrad)" stroke="#eab308" stroke-width="1.2" />
    <circle cx="20" cy="22" r="9" fill="#a16207" />
    <text x="20" y="26" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">07</text>
    <text x="36" y="25" font-size="11" font-weight="700" fill="#f1f5f9">Bayesian Net</text>

    <text x="12" y="48" font-size="9" fill="#94a3b8">• pgmpy DAG Engine</text>
    <text x="12" y="62" font-size="9" fill="#94a3b8">• TabularCPD Fitting</text>
    <text x="12" y="76" font-size="9" fill="#facc15" font-weight="600">• check_model() PASS</text>
    <rect x="10" y="84" width="110" height="10" rx="2" fill="#713f12" fill-opacity="0.3" />
    <text x="65" y="92" font-size="7.5" fill="#fef08a" font-weight="600" text-anchor="middle">Valid Pearl Structure</text>
  </g>

  <!-- Stage 6: Causal Inference / Do-Calculus -->
  <g transform="translate(795, 60)">
    <rect width="120" height="100" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="22" r="9" fill="#047857" />
    <text x="20" y="26" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">08</text>
    <text x="36" y="25" font-size="11" font-weight="700" fill="#f1f5f9">Inference</text>

    <text x="12" y="48" font-size="9" fill="#94a3b8">• Conditional P(Y|E)</text>
    <text x="12" y="62" font-size="9" fill="#94a3b8">• Intervene do(X)</text>
    <text x="12" y="76" font-size="9" fill="#34d399" font-weight="600">• d-separation Test</text>
    <rect x="10" y="84" width="100" height="10" rx="2" fill="#064e3b" fill-opacity="0.3" />
    <text x="60" y="92" font-size="7.5" fill="#6ee7b7" font-weight="600" text-anchor="middle">Causal Query Output</text>
  </g>

  <!-- Bottom Paradigm Comparison Panel -->
  <g transform="translate(25, 180)">
    <rect width="890" height="115" rx="10" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
    
    <!-- Left Section: Why Statistical NLP Fails -->
    <g transform="translate(25, 20)">
      <circle cx="10" cy="10" r="5" fill="#f43f5e" />
      <text x="24" y="14" font-size="12" font-weight="700" fill="#f43f5e">Why Statistical NLP / LLMs Fall Short Alone</text>
      <text x="24" y="36" font-size="10" fill="#94a3b8">
        • Surface correlations are conflated with causation (collider bias, confounding).
      </text>
      <text x="24" y="52" font-size="10" fill="#94a3b8">
        • Text relation extractors produce edges independently, creating invalid directed cycles.
      </text>
      <text x="24" y="68" font-size="10" fill="#94a3b8">
        • Cannot answer counterfactual or interventional queries: P(Y | do(X)) ≠ P(Y | X).
      </text>
    </g>

    <!-- Center Arrow / Transition -->
    <path d="M 440 30 L 455 45 L 440 60" stroke="#818cf8" stroke-width="2" fill="none" />
    <text x="448" y="78" font-size="8.5" fill="#818cf8" font-weight="700" text-anchor="middle">RESOLVED BY</text>

    <!-- Right Section: Neuro-Symbolic Resolution -->
    <g transform="translate(485, 20)">
      <circle cx="10" cy="10" r="5" fill="#10b981" />
      <text x="24" y="14" font-size="12" font-weight="700" fill="#34d399">The Neuro-Symbolic Solution (Phase 1 Engine)</text>
      <text x="24" y="36" font-size="10" fill="#cbd5e1">
        • <tspan font-weight="700" fill="#38bdf8">Statistical Extraction:</tspan> Extracts candidate causal triples + confidence weights from text.
      </text>
      <text x="24" y="52" font-size="10" fill="#cbd5e1">
        • <tspan font-weight="700" fill="#fb7185">Symbolic Cycle Pruning:</tspan> Enforces acyclicity via greedy lowest-confidence edge pruning.
      </text>
      <text x="24" y="68" font-size="10" fill="#cbd5e1">
        • <tspan font-weight="700" fill="#34d399">Pearlian Bayesian Engine:</tspan> Fits CPDs and simulates do-calculus graph mutilation.
      </text>
    </g>
  </g>
</svg>
