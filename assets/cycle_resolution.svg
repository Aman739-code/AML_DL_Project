<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#080d19" />
    </linearGradient>

    <marker id="arrowRed" viewBox="0 0 10 10" refX="16" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="16" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="16" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <filter id="warnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .cycle-highlight {
      stroke-dasharray: 6 4;
      animation: alertCycle 2s ease-in-out infinite;
    }
    .pruned-edge {
      animation: snipEdge 4s ease-in-out infinite;
    }
    .scissor-icon {
      animation: snipAction 4s ease-in-out infinite;
    }
    .dag-edge {
      stroke-dasharray: 8 4;
      animation: dagFlow 8s linear infinite;
    }
    @keyframes alertCycle {
      0% { stroke: #fb7185; stroke-width: 2.5; opacity: 0.6; }
      50% { stroke: #f43f5e; stroke-width: 3.5; opacity: 1; }
      100% { stroke: #fb7185; stroke-width: 2.5; opacity: 0.6; }
    }
    @keyframes snipEdge {
      0% { opacity: 0.9; stroke-dasharray: 4 4; }
      40% { opacity: 0.9; stroke-dasharray: 4 4; }
      60% { opacity: 0.1; stroke-dasharray: 2 6; }
      90% { opacity: 0.05; }
      100% { opacity: 0.9; stroke-dasharray: 4 4; }
    }
    @keyframes snipAction {
      0% { transform: scale(0.9) rotate(0deg); opacity: 0.2; }
      30% { transform: scale(1.1) rotate(-15deg); opacity: 1; }
      50% { transform: scale(1.2) rotate(15deg); opacity: 1; }
      70% { transform: scale(0.9) rotate(0deg); opacity: 0.2; }
      100% { transform: scale(0.9) rotate(0deg); opacity: 0.2; }
    }
    @keyframes dagFlow {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Canvas Background -->
  <rect x="2" y="2" width="916" height="296" rx="14" fill="url(#crBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.4">
      SYMBOLIC STAGE: CONFIDENCE-GUIDED CYCLE RESOLUTION &amp; DAG FORMATION
    </text>
    <text x="0" y="18" font-size="11" fill="#94a3b8">
      Independent relation extraction generates feedback loops. Our greedy pruning guarantees a valid Pearlian DAG.
    </text>
  </g>

  <!-- Left Side: Unconstrained Graph (With Cycles) -->
  <g transform="translate(30, 75)">
    <rect width="360" height="195" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="160" height="20" rx="4" fill="#881337" fill-opacity="0.3" stroke="#f43f5e" stroke-width="0.8" />
    <text x="95" y="26" font-size="9" font-weight="700" fill="#fda4af" text-anchor="middle">❌ RAW EXTRACTED (CYCLES)</text>

    <!-- Node A -->
    <circle cx="70" cy="75" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="70" y="79" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">A</text>

    <!-- Node B -->
    <circle cx="180" cy="75" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="180" y="79" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">B</text>

    <!-- Node C -->
    <circle cx="125" cy="155" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="125" y="159" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">C</text>

    <!-- Node D -->
    <circle cx="280" cy="115" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="280" y="119" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">D</text>

    <!-- Forward Edges -->
    <line x1="84" y1="75" x2="166" y2="75" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <line x1="174" y1="87" x2="135" y2="143" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <line x1="194" y1="81" x2="266" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <line x1="139" y1="150" x2="266" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Animated Cycle Edge (C -> A creates cycle A -> B -> C -> A) -->
    <path d="M 115 145 C 75 140 60 115 65 92" fill="none" stroke="#f43f5e" class="cycle-highlight" marker-end="url(#arrowRed)" />
    
    <!-- Edge Snipped Indicator -->
    <g transform="translate(75, 120)" class="scissor-icon">
      <circle cx="0" cy="0" r="11" fill="#881337" stroke="#f43f5e" stroke-width="1" />
      <text x="0" y="4" font-size="11" text-anchor="middle">✂️</text>
    </g>

    <!-- Warning / Stats Pill -->
    <rect x="230" y="15" width="115" height="42" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
    <text x="240" y="32" font-size="8.5" fill="#f87171" font-weight="700">• 15 Cycles Detected</text>
    <text x="240" y="47" font-size="8.5" fill="#94a3b8">• 30 Extracted Edges</text>
  </g>

  <!-- Center Transformation Arrow -->
  <g transform="translate(410, 150)">
    <rect x="0" y="-30" width="100" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="50" y="-12" font-size="8.5" font-weight="700" fill="#38bdf8" text-anchor="middle">GREEDY PRUNER</text>
    <text x="50" y="2" font-size="7.5" fill="#94a3b8" text-anchor="middle">min(confidence)</text>
    <path d="M 35 15 L 65 15 M 55 9 L 65 15 L 55 21" stroke="#38bdf8" stroke-width="2" fill="none" />
  </g>

  <!-- Right Side: Resolved Directed Acyclic Graph (DAG) -->
  <g transform="translate(530, 75)">
    <rect width="360" height="195" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Title Badge -->
    <rect x="15" y="12" width="165" height="20" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8" />
    <text x="97" y="26" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">✅ VALID PEARLIAN DAG</text>

    <!-- Node A (Root) -->
    <circle cx="65" cy="95" r="15" fill="#065f46" stroke="#10b981" stroke-width="2" />
    <text x="65" y="99" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">A</text>
    <text x="65" y="123" font-size="8" fill="#6ee7b7" text-anchor="middle">Root</text>

    <!-- Node B (Mediator) -->
    <circle cx="165" cy="70" r="15" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="165" y="74" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">B</text>

    <!-- Node C (Mediator) -->
    <circle cx="165" cy="140" r="15" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="165" y="144" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">C</text>

    <!-- Node D (Sink / Target) -->
    <circle cx="280" cy="105" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="280" y="109" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">D</text>
    <text x="280" y="133" font-size="8" fill="#6ee7b7" text-anchor="middle">Sink</text>

    <!-- Directed Valid Edges -->
    <line x1="80" y1="90" x2="150" y2="73" stroke="#10b981" stroke-width="1.8" class="dag-edge" marker-end="url(#arrowGreen)" />
    <line x1="80" y1="102" x2="150" y2="135" stroke="#10b981" stroke-width="1.8" class="dag-edge" marker-end="url(#arrowGreen)" />
    <line x1="180" y1="75" x2="265" y2="100" stroke="#10b981" stroke-width="1.8" class="dag-edge" marker-end="url(#arrowGreen)" />
    <line x1="180" y1="135" x2="265" y2="110" stroke="#10b981" stroke-width="1.8" class="dag-edge" marker-end="url(#arrowGreen)" />

    <!-- Success Stats Pill -->
    <rect x="235" y="15" width="110" height="42" rx="6" fill="#111827" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <text x="245" y="32" font-size="8.5" fill="#34d399" font-weight="700">• 0 Cycles Remaining</text>
    <text x="245" y="47" font-size="8.5" fill="#a7f3d0">• 15 Verified Edges</text>
  </g>
</svg>
