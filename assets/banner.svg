<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .node-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .node-pulse-2 {
      animation: pulse 3s ease-in-out infinite alternate 1.5s;
    }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: dashMove 20s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 6 6;
      animation: dashMoveRev 25s linear infinite;
    }
    .signal-particle {
      animation: travel1 4s ease-in-out infinite;
    }
    .signal-particle-2 {
      animation: travel2 5s ease-in-out infinite 1s;
    }
    .signal-particle-3 {
      animation: travel3 4.5s ease-in-out infinite 0.5s;
    }
    .badge-float {
      animation: badgeHover 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.6; filter: drop-shadow(0 0 2px #38bdf8); }
      100% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
    @keyframes dashMoveRev {
      to { stroke-dashoffset: 200; }
    }
    @keyframes travel1 {
      0% { cx: 70px; cy: 75px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 160px; cy: 120px; opacity: 0; }
    }
    @keyframes travel2 {
      0% { cx: 160px; cy: 120px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 110px; cy: 205px; opacity: 0; }
    }
    @keyframes travel3 {
      0% { cx: 70px; cy: 75px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 50px; cy: 180px; opacity: 0; }
    }
    @keyframes badgeHover {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-3px); }
    }
  </style>

  <!-- Background Canvas -->
  <rect x="2" y="2" width="916" height="276" rx="16" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Decorative Grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="920" y2="40" />
    <line x1="0" y1="80" x2="920" y2="80" />
    <line x1="0" y1="120" x2="920" y2="120" />
    <line x1="0" y1="160" x2="920" y2="160" />
    <line x1="0" y1="200" x2="920" y2="200" />
    <line x1="0" y1="240" x2="920" y2="240" />
    <line x1="100" y1="0" x2="100" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="500" y1="0" x2="500" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="700" y1="0" x2="700" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
  </g>

  <!-- LEFT: Interactive Neuro-Symbolic Causal Graph Animation -->
  <g id="causal-network">
    <!-- Causal Graph Edges -->
    <path d="M 70 75 L 160 120" stroke="#38bdf8" stroke-width="1.8" class="stream-line" opacity="0.6" />
    <path d="M 70 75 L 50 180" stroke="#818cf8" stroke-width="1.5" class="stream-line-rev" opacity="0.5" />
    <path d="M 160 120 L 110 205" stroke="#c084fc" stroke-width="1.8" class="stream-line" opacity="0.6" />
    <path d="M 50 180 L 110 205" stroke="#34d399" stroke-width="1.5" class="stream-line" opacity="0.5" />
    <path d="M 160 120 L 220 170" stroke="#38bdf8" stroke-width="1.5" class="stream-line-rev" opacity="0.5" />
    <path d="M 110 205 L 220 170" stroke="#f472b6" stroke-width="1.8" class="stream-line" opacity="0.6" />

    <!-- Travelling Energy Particles (Do-Calculus Signals) -->
    <circle class="signal-particle" r="3.5" fill="#00f5ff" filter="url(#subtleGlow)" />
    <circle class="signal-particle-2" r="3.5" fill="#e879f9" filter="url(#subtleGlow)" />
    <circle class="signal-particle-3" r="3" fill="#34d399" filter="url(#subtleGlow)" />

    <!-- Nodes with variable labels -->
    <!-- Node A (Cause) -->
    <g transform="translate(70, 75)">
      <circle r="16" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <circle class="node-pulse" r="7" fill="#38bdf8" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
      <text x="-2" y="-20" font-size="9" fill="#7dd3fc" font-weight="500" text-anchor="middle">Cause</text>
    </g>

    <!-- Node B (Mediator) -->
    <g transform="translate(160, 120)">
      <circle r="16" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.5" />
      <circle class="node-pulse-2" r="7" fill="#818cf8" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
      <text x="24" y="3" font-size="9" fill="#c7d2fe" font-weight="500">Mediator</text>
    </g>

    <!-- Node C (Confounder) -->
    <g transform="translate(50, 180)">
      <circle r="15" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" />
      <circle class="node-pulse" r="6" fill="#34d399" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
      <text x="-24" y="4" font-size="9" fill="#6ee7b7" font-weight="500" text-anchor="end">Confounder</text>
    </g>

    <!-- Node D (Target/Collider) -->
    <g transform="translate(110, 205)">
      <circle r="17" fill="#701a75" fill-opacity="0.3" stroke="#e879f9" stroke-width="1.5" />
      <circle class="node-pulse-2" r="7.5" fill="#f43f5e" />
      <text x="0" y="4" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Y</text>
      <text x="0" y="27" font-size="9" fill="#f472b6" font-weight="600" text-anchor="middle">P(Y | do(A))</text>
    </g>

    <!-- Node E (Evidence) -->
    <g transform="translate(220, 170)">
      <circle r="14" fill="#1e1b4b" fill-opacity="0.4" stroke="#a78bfa" stroke-width="1.5" />
      <circle class="node-pulse" r="5.5" fill="#a78bfa" />
      <text x="0" y="3" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Vertical Divider / Beam -->
  <line x1="265" y1="35" x2="265" y2="245" stroke="url(#borderGrad)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.4" />

  <!-- RIGHT: Title, Subtitle, Badges, and Stats -->
  <g transform="translate(295, 0)">
    <!-- Top Pill / Status Tag -->
    <g transform="translate(0, 36)" class="badge-float">
      <rect width="180" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="12" cy="11" r="4" fill="#38bdf8" filter="url(#subtleGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="15" font-size="10" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">CSAI PHASE 1 • AML PIPELINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" font-size="25" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.3">
      Neuro-Symbolic Causal Inference
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Bridging Statistical Language Models &amp; Pearlian Bayesian Networks on Corr2Cause
    </text>

    <!-- 4 Interactive Stat Cards -->
    <g transform="translate(0, 134)">
      <!-- Card 1: Dataset -->
      <g transform="translate(0, 0)">
        <rect width="138" height="58" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <rect width="138" height="3" rx="1" fill="#38bdf8" />
        <text x="12" y="24" font-size="10" font-weight="600" fill="#94a3b8" text-transform="uppercase">CORR2CAUSE</text>
        <text x="12" y="46" font-size="16" font-weight="800" fill="#f8fafc">411,469</text>
        <text x="76" y="46" font-size="10" font-weight="500" fill="#64748b">pairs</text>
      </g>

      <!-- Card 2: Feature Dim -->
      <g transform="translate(148, 0)">
        <rect width="138" height="58" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <rect width="138" height="3" rx="1" fill="#818cf8" />
        <text x="12" y="24" font-size="10" font-weight="600" fill="#94a3b8" text-transform="uppercase">FEATURES</text>
        <text x="12" y="46" font-size="16" font-weight="800" fill="#f8fafc">28 Dims</text>
        <text x="82" y="46" font-size="10" font-weight="500" fill="#64748b">causal</text>
      </g>

      <!-- Card 3: Best F1 Score -->
      <g transform="translate(296, 0)">
        <rect width="144" height="58" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <rect width="144" height="3" rx="1" fill="#34d399" />
        <text x="12" y="24" font-size="10" font-weight="600" fill="#94a3b8" text-transform="uppercase">CHAMPION F1</text>
        <text x="12" y="46" font-size="16" font-weight="800" fill="#34d399">0.5907</text>
        <text x="76" y="46" font-size="10" font-weight="500" fill="#10b981">LinearSVM</text>
      </g>

      <!-- Card 4: DAG / Cycles -->
      <g transform="translate(450, 0)">
        <rect width="140" height="58" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <rect width="140" height="3" rx="1" fill="#f43f5e" />
        <text x="12" y="24" font-size="10" font-weight="600" fill="#94a3b8" text-transform="uppercase">CYCLES SOLVED</text>
        <text x="12" y="46" font-size="16" font-weight="800" fill="#fb7185">15 / 15</text>
        <text x="74" y="46" font-size="10" font-weight="500" fill="#fda4af">→ Pure DAG</text>
      </g>
    </g>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 212)">
      <g transform="translate(0, 0)">
        <rect width="105" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="52" y="15" font-size="9.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">⚡ Pearl Do-Calculus</text>
      </g>
      <g transform="translate(112, 0)">
        <rect width="112" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="56" y="15" font-size="9.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">🔬 pgmpy Exact BN</text>
      </g>
      <g transform="translate(231, 0)">
        <rect width="110" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="55" y="15" font-size="9.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">🎯 Zero Data Leak</text>
      </g>
      <g transform="translate(348, 0)">
        <rect width="118" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="59" y="15" font-size="9.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">🛡️ 34/34 Unit Tests</text>
      </g>
      <g transform="translate(473, 0)">
        <rect width="117" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="58" y="15" font-size="9.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">🌱 Seed = 42 Fixed</text>
      </g>
    </g>
  </g>
</svg>
